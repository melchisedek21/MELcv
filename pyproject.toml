[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "melcv"
version = "0.1.0"
description = "Assistant local (Ollama) qui adapte CV et lettres de motivation à une offre d'emploi."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["python-docx>=1.1", "reportlab>=4.0", "pypdf>=4.0"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
melcv = "melcv.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
melcv = ["web/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
